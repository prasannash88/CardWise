name: Publish APK to apk-latest branch

# Copies the newest APK onto the apk-latest branch (replaced each time, no history),
# so it can be fetched with plain git and handed to the phone.
on:
  workflow_run:
    workflows: [Emulator smoke test]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run ID whose APK to publish
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Find build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w "Build Android APK" -s success -L 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: CardWise-apk
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apk

      - name: Push to apk-latest
        run: |
          set -o pipefail
          ls -la "$RUNNER_TEMP/apk"
          git config user.name "cardwise-ci"
          git config user.email "cardwise-ci@users.noreply.github.com"
          git checkout -q --orphan apk-latest
          git rm -rfq .
          git clean -fdxq
          cp "$RUNNER_TEMP"/apk/*.apk CardWise.apk
          git add CardWise.apk
          git commit -q -m "CardWise APK from build run ${{ steps.run.outputs.id }}"
          if ! git push -f origin apk-latest 2> push.err; then
            echo "::error title=push failed::$(tr '\n' ' ' < push.err)"
            exit 1
          fi
