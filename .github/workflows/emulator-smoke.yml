name: Emulator smoke test

on:
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run ID whose APK to test (blank = latest successful)
        required: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Find build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ github.event.workflow_run.id || inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w "Build Android APK" -s success -L 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: CardWise-apk
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            screen.png
