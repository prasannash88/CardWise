name: Weekly benefits monitor

on:
  schedule:
    - cron: '23 2 * * 1' # Mondays 07:53 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check card pages
        working-directory: monitor
        run: |
          npm ci
          node check.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit results
        run: |
          git config user.name "cardwise-monitor"
          git config user.email "cardwise-monitor@users.noreply.github.com"
          git add monitor/state.json monitor/updates.json
          git diff --cached --quiet || git commit -m "Monitor: benefits check $(date -u +%F)"
          git push
